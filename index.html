<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Root-relative, not absolute. The leading slash is load-bearing:
         prerender-photos.mjs clones this head into /photo/<cat>/<slug>.html,
         and a document-relative path would resolve to
         /photo/<cat>/assets/… which the SPA catch-all answers with 200 HTML
         rather than a 404. Absolute prod URLs also broke preview/localhost. -->
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Prevent iOS Safari's focus-auto-zoom on form inputs. Safari zooms
         in whenever a focused input's computed font-size is under 16px,
         and never zooms back out after submit. So a client logging into
         the portal on iPhone would land on the authenticated view still
         zoomed in, having to pinch out. Enforcing 16px at mobile widths
         only kills the trigger without affecting the design at desktop
         sizes. Lives in the HTML head (not the Chakra theme) because
         Chakra's global-style compiler was silently dropping the
         input[type=...] selectors when we tried this from the theme. -->
    <style>
      @media (max-width: 768px) {
        input[type="email"],
        input[type="password"],
        input[type="text"],
        input[type="tel"],
        input[type="search"],
        input[type="number"],
        input[type="url"],
        textarea,
        select {
          font-size: 16px !important;
        }
      }
    </style>

    <title>Vero Photography | Scranton Wedding & Portrait Photographer</title>
    <meta name="description" content="Wedding, portrait, family, and maternity photography by Veronika Gerzon. Based in Scranton, Pennsylvania — available worldwide." />

    <!-- Search engines:
         - `index, follow` is the default but explicit here so it's not lost
           if some crawler reads a default-deny.
         - `max-image-preview:large` is one of Google's two officially
           documented levers for SERP thumbnail behavior — it doesn't pick
           the image but ensures whatever Google picks gets rendered at
           full size (vs the smaller default). Per Google's own case
           studies this can lift CTR substantially.
         React Helmet renders a duplicate per-route at runtime, but having
         the signal in static HTML guarantees first-pass indexing sees it. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Homepage canonical in STATIC html, so a crawler that does not execute
         JS sees one. React Helmet renders a duplicate at runtime, and
         prerender-photos.mjs strips every canonical before injecting its own
         per-photo one — so /photo/* pages never end up with two. -->
    <link rel="canonical" href="https://vero.photography/" />

    <!-- The camera-body preload used to live here. Removed: at scroll 0 the LCD
         overshoots the viewport by 1.2x, so the camera body is 100% occluded on
         every viewport up to ~2940 CSS px wide — we were spending 182KB at
         fetchpriority=high on an image nobody sees, on EVERY route, because the
         SPA rewrite serves this HTML for /gallery, /about, /portal and /admin
         too. The <img> in HeroSection.tsx keeps its own fetchPriority="high"
         and decoding="sync" (the iOS sharpness fix), so it still arrives
         promptly on ultrawide displays where it IS visible at scroll 0. -->

    <!-- Warm the gtag connection during the bundle download instead of after
         it. No crossorigin: react-ga4 injects gtag as a plain non-CORS
         <script async src>, so an anonymous preconnect socket would land in a
         different pool, get no reuse, and log a "preconnect was not used"
         warning. Only googletagmanager — the analytics.google.com and
         doubleclick beacons fire past Chrome's ~10s idle-socket timeout.
         MUST stay above the Open Graph comment below: prerender-photos.mjs
         strips from that comment onward when building each photo page. -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />

    <!-- Typefaces. Self-hosted rather than Google-hosted: a third-party font
         origin costs a DNS+TCP+TLS handshake inside the render path, which is
         the same cost we deliberately avoided for the Instagram avatar.
         Variable woff2, latin subset — 37KB + 26KB.

         Preloaded because CLS is currently 0 and that is worth 25 of the 100
         Lighthouse points. A font that arrives after first paint reflows every
         line of text on the page. Preloading plus a SERIF fallback for the
         display face (Georgia, not the system sans) keeps any swap that does
         happen to a small metric change rather than a large one. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/assets/fonts/cormorant-garamond-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/assets/fonts/jost-latin.woff2" />
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/assets/fonts/cormorant-garamond-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Jost';
        font-style: normal;
        font-weight: 300 600;
        font-display: swap;
        src: url('/assets/fonts/jost-latin.woff2') format('woff2');
      }
    </style>

    <!-- The mobile LCP element. It lived only inside the JSON-LD below, so it
         could not be fetched until React had rendered the navbar — the
         waterfall showed the request starting at 3558ms, at Low priority,
         with the main bundle already finished at 2274ms. Preloading moves
         discovery into the first HTML pass. 11KB, so the cost is trivial and
         it is needed on every page. -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/logo.svg"
      type="image/svg+xml"
      fetchpriority="high"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vero Photography" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_DO" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image"
      content="https://vero.photography/assets/photos/site/contact-bg.webp"
    />
    <meta property="og:image:alt" content="Vero Photography - Professional Photographer" />

    <!-- Structured Data: WebPage with primaryImageOfPage is the canonical
         signal Google uses (alongside og:image) to choose the SERP
         thumbnail. Static placement ensures Google sees it on first crawl
         instead of waiting for the second-pass JS render that picks up
         the React-Helmet-rendered version. The homepage's hero camera
         image was winning Google's automated picker on visual prominence
         alone — this gives Google an explicit pointer to contact-bg.webp
         as the page's representative image. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "url": "https://vero.photography/",
      "name": "Vero Photography | Scranton Wedding & Portrait Photographer",
      "description": "Wedding, portrait, family, and maternity photography by Veronika Gerzon. Based in Scranton, Pennsylvania — available worldwide.",
      "inLanguage": "en-US",
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "url": "https://vero.photography/assets/photos/site/contact-bg.webp",
        "width": 1200,
        "height": 630
      }
    }
    </script>

    <!-- Structured Data: ProfessionalService is the correct schema.org type
         for a service business — "Photographer" was not a valid @type and
         was triggering validation errors across every page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Vero Photography",
      "alternateName": "Veronika Gerzon Photography",
      "image": "https://vero.photography/assets/photos/site/contact-bg.webp",
      "logo": "https://vero.photography/assets/images/logo.svg",
      "url": "https://vero.photography",
      "sameAs": [
        "https://g.page/r/CSNq8ccyWt_wEAE",
        "https://www.instagram.com/vero.art.photo"
      ],
      "telephone": "+1-570-909-5707",
      "priceRange": "$$",
      "description": "Wedding, portrait, family, and maternity photography by Veronika Gerzon. Based in Scranton, Pennsylvania — available worldwide.",
      "founder": {
        "@type": "Person",
        "name": "Veronika Gerzon"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Scranton",
        "addressRegion": "PA",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "41.4087",
        "longitude": "-75.6621"
      },
      "areaServed": [
        { "@type": "City", "name": "Scranton" },
        { "@type": "AdministrativeArea", "name": "Northeast Pennsylvania" },
        { "@type": "Country", "name": "United States" },
        { "@type": "Place", "name": "Worldwide" }
      ],
      "knowsAbout": [
        "Wedding Photography",
        "Portrait Photography",
        "Family Photography",
        "Maternity Photography",
        "Destination Photography"
      ],
      "sameAs": [
        "https://www.instagram.com/vero.art.photo/"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Wedding Photography",
      "provider": {
        "@type": "Organization",
        "name": "Vero Photography",
        "url": "https://vero.photography"
      },
      "areaServed": {
        "@type": "GeoCircle",
        "geoMidpoint": {
          "@type": "GeoCoordinates",
                  "latitude": "41.4087",
        "longitude": "-75.6621"
        },
        "geoRadius": "50000"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Photography Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Wedding Photography Package",
              "description": "Full day wedding coverage with professional editing and high-resolution digital images"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Portrait Session",
              "description": "Professional portrait photography session with multiple outfit changes and locations"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Family Photography",
              "description": "Family portrait session capturing precious moments and relationships"
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <!-- VG-HOME-NOSCRIPT:START — stripped from /photo/* by prerender-photos.mjs,
         which injects its own per-photo noscript after the root div. Without
         this, a crawler or AI agent that does not execute JS sees a completely
         empty body on every route except /photo/*, which is most of why
         DebugBear's agentic-browsing score sits at 0.33. -->
    <noscript>
      <h1>Vero Photography</h1>
      <p>
        Wedding, portrait, family, and maternity photography by Veronika Gerzon.
        Based in Scranton, Pennsylvania — available worldwide.
      </p>
      <nav aria-label="Site">
        <ul>
          <li><a href="/gallery">Gallery</a></li>
          <li><a href="/gallery/weddings">Wedding photography</a></li>
          <li><a href="/gallery/portraits">Portrait photography</a></li>
          <li><a href="/gallery/family">Family photography</a></li>
          <li><a href="/gallery/maternity">Maternity photography</a></li>
          <li><a href="/about">About Veronika</a></li>
          <li><a href="/journal">Journal</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </nav>
      <p>
        Enable JavaScript for the full experience, or reach Veronika directly at
        <a href="tel:+15709095707">(570) 909-5707</a>.
      </p>
    </noscript>
    <!-- VG-HOME-NOSCRIPT:END -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
